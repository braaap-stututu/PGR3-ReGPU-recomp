# ReXenon config for Project Gotham Racing 3 (Europe disc), title 4D5307D1, default.xex version 0xB
# (built 2006-10-05, updates folded in; TU5 not used), SHA-256 26fb114109f0fa997497c6836385b8af391db253d75c08d78d12f4899475a78a.
# Paths are relative to this file. Quirk numbers refer to PGR3-QUIRKS.md.
[main]
file_path = "../game/default.xex"
out_directory_path = "../out/ppc"
switch_table_file_path = "pgr3_switch_tables.toml"

# Registers kept in host locals instead of the guest context, as in FM3/PGR4.
skip_lr = false
skip_msr = false
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers: tools/pgr3_config.py --write (one match each in this image).
restgprlr_14_address = 0x82478670
savegprlr_14_address = 0x82478620
restfpr_14_address = 0x82478F9C
savefpr_14_address = 0x82478F50
restvmx_14_address = 0x82479A98
savevmx_14_address = 0x82479800
restvmx_64_address = 0x82479B2C
savevmx_64_address = 0x82479894

# Q7: CRT setjmp/longjmp, mapped to host setjmp/longjmp with the guest context saved and restored.
# Checked in build/tools/ppcdis.exe: setjmp (no .pdata) 8247F3D0..8247F49C first jumps through an override
# pointer at 8294BBC8 if set, then stores f14-f31 at +0, r13-r31 at +152, CR at +304, LR at +308, r1 at +144,
# clears +312 and returns 0. longjmp (.pdata 8247F2B0+114) reads +312, unwinds via 8248BB90 with LR/r1,
# then restores the same layout: the FM3/FM4 CRT layout. The other ld-run candidate (82491414, base r4)
# is an exception-unwind CONTEXT restore, not longjmp.
setjmp_address = 0x8247F3D0
longjmp_address = 0x8247F2B0

functions = [
    # setjmp has no .pdata (as in FM3).
    { address = 0x8247F3D0, size = 0xCC },

    # .pdata 82465300+514 ends before its exception data (8246587C) and funclet (.pdata 82465884, addi r31,r12,..);
    # its own epilogue sits after the funclet at 824658E4..82465900, reached by b from 82465810. One function to
    # 82465900 (the exception words are skipped by invalid_instructions; the funclet is only reached by unwinding).
